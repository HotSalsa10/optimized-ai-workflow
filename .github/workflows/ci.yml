name: CI

# Linux runs on every change. Windows (Git Bash) and macOS run on release tags
# and when started by hand, to save the private repo's CI minutes (DECISIONS A19).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_SHELLCHECK: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repo checks
        run: bash scripts/dev/validate.sh
      - name: Tests and planted defects
        run: bash tests/run.sh

  other-systems:
    name: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repo checks
        run: bash scripts/dev/validate.sh
      - name: Tests and planted defects
        run: bash tests/run.sh
